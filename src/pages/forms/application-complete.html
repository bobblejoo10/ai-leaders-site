<script>
(function(){
  var params = new URLSearchParams(location.search);
  var COMPLETION_KEY = 'aiLeadersLastApplication';

  function storageState(storage) {
    if (!storage) return { available: false, value: null };
    try { return { available: true, value: storage.getItem(COMPLETION_KEY) }; }
    catch (error) { return { available: false, value: null }; }
  }

  function parsePayload(raw) {
    if (!raw) return null;
    try {
      var value = JSON.parse(raw);
      return value && typeof value === 'object' ? value : null;
    } catch (error) { return null; }
  }

  function validApplicationId(value) {
    return /^app-[a-z0-9]+-[a-z0-9]+$/.test(String(value || ''));
  }

  function storageFlag(storage, key) {
    if (!storage) return false;
    try { return storage.getItem(key) === '1'; } catch (error) { return false; }
  }

  function markStorageFlag(storage, key) {
    if (!storage) return;
    try { storage.setItem(key, '1'); } catch (error) {}
  }

  var sessionStore = null;
  var localStore = null;
  try { sessionStore = window.sessionStorage; } catch (error) {}
  try { localStore = window.localStorage; } catch (error) {}
  var sessionState = storageState(sessionStore);
  var localState = storageState(localStore);
  var sessionPayload = parsePayload(sessionState.value);
  var localPayload = parsePayload(localState.value);
  var queryPayload = {
    applicationId: params.get('applicationId') || '',
    courseId: params.get('courseId') || '',
    courseCode: params.get('courseCode') || '',
    courseTitle: params.get('courseTitle') || '',
    courseType: params.get('courseType') === 'paid' ? 'paid' : 'free',
    source: 'completion-url'
  };
  var payload = null;
  if (sessionPayload && validApplicationId(sessionPayload.applicationId)) {
    payload = sessionPayload;
  } else if (localPayload && validApplicationId(localPayload.applicationId)) {
    payload = localPayload;
  } else if ((!sessionState.available || !localState.available)
      && validApplicationId(queryPayload.applicationId)) {
    // The URL fallback is used only when browser storage is unavailable.
    // This prevents a copied completion URL from creating a normal conversion.
    payload = queryPayload;
  } else {
    payload = {};
  }
  var courseId = payload.courseId || params.get('courseId') || '';
  var courseCode = payload.courseCode || params.get('courseCode') || '';
  var courseTitle = payload.courseTitle || params.get('courseTitle') || '';
  var courseType = payload.courseType || params.get('courseType') || '';
  var attributionContext = payload.attribution || (window.AiLeadersLayout && typeof window.AiLeadersLayout.getAttributionContext === 'function'
    ? window.AiLeadersLayout.getAttributionContext()
    : {});
  var meta = document.getElementById('completeMeta');
  if (courseTitle) {
    meta.textContent = '신청 강연: ' + courseTitle;
    meta.style.display = 'block';
  }
  if (location.search && history.replaceState) {
    history.replaceState(null, document.title, '/application-complete/');
  }
  // 신청 완료 1건당 Google Ads 완료 이벤트를 한 번만 전송한다.
  // 완료 URL 직접 접속과 새로고침은 전환으로 집계하지 않는다.
  var applicationId = validApplicationId(payload.applicationId) ? payload.applicationId : '';
  var dlKey = 'aiLeadersDlPushed:' + applicationId;
  var dlAlready = storageFlag(sessionStore, dlKey) || storageFlag(localStore, dlKey);
  if (applicationId && !dlAlready) {
    markStorageFlag(sessionStore, dlKey);
    markStorageFlag(localStore, dlKey);
    window.dataLayer = window.dataLayer || [];
    window.dataLayer.push({
      event: 'lecture_application_complete',
      event_id: applicationId,
      transaction_id: applicationId,
      course_id: courseId,
      course_code: courseCode,
      course_title: courseTitle,
      course_type: courseType,
      attribution_context: attributionContext
    });
  }
  // 신청 완료 1건당 Purchase를 한 번만 전송한다.
  // 완료 URL 직접 접속과 새로고침은 전환으로 집계하지 않는다.
  if (applicationId && typeof window.aiLeadersTrackMeta === 'function') {
    var sentKey = 'aiLeadersPurchaseSent:' + applicationId;
    var alreadySent = storageFlag(sessionStore, sentKey) || storageFlag(localStore, sentKey);
    if (!alreadySent) {
      markStorageFlag(sessionStore, sentKey);
      markStorageFlag(localStore, sentKey);
      window.aiLeadersTrackMeta('Purchase', {
        content_name: courseTitle || '강연 신청',
        content_category: courseType === 'paid' ? 'paid_lecture' : 'free_lecture',
        content_ids: courseCode ? [courseCode] : [],
        content_type: 'product',
        num_items: 1,
        value: 0,
        currency: 'KRW'
      }, { eventID: applicationId });
    }
  }
})();
</script>
